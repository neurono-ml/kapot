[package]
name = "kapot-cli"
description = "Command Line Client for kapot distributed query engine."
version = "44.0.0"
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
edition = "2021"
keywords = ["kapot", "cli"]
license = "Apache-2.0"
homepage = "https://github.com/apache/arrow-kapot"
repository = "https://github.com/apache/arrow-kapot"
readme = "README.md"

[dependencies]
kapot = { path = "../client", version = "44.0.0", features = ["standalone"] }
clap = { workspace = true, features = ["derive", "cargo"] }
datafusion = { workspace = true }
datafusion-cli = { workspace = true }
dirs = "5.0.1"
env_logger = { workspace = true }
mimalloc = { workspace = true }
rustyline = "14.0.0"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "parking_lot"] }

[features]
object-stores = ["azure", "gcs", "s3", "mgc", "oss"]
azure = ["kapot/azure"]
s3 = ["kapot/s3"]
oss = ["kapot/oss"]
gcs = ["kapot/gcs"]
mgc = ["kapot/mgc"]

default = ["object-stores"]