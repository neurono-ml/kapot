[package]
name = "kapot"
description = "kapot Distributed Compute"
license = "Apache-2.0"
version = { workspace = true }
homepage = "https://github.com/apache/arrow-kapot"
repository = "https://github.com/apache/arrow-kapot"
readme = "README.md"
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
edition = "2021"

[dependencies]
async-trait = { workspace = true }
kapot-core = { path = "../core", version = "2.0.0" }
kapot-executor = { path = "../executor", version = "2.0.0", optional = true }
kapot-scheduler = { path = "../scheduler", version = "2.0.0", optional = true }
datafusion = { workspace = true }
log = { workspace = true }

tokio = { workspace = true }
url = { workspace = true }

[dev-dependencies]
kapot-executor = { path = "../executor", version = "2.0.0" }
kapot-scheduler = { path = "../scheduler", version = "2.0.0" }
ctor = { workspace = true }
datafusion-proto = { workspace = true }
env_logger = { workspace = true }
rstest = { version = "0.23" }
tempfile = { workspace = true }
tonic = { workspace = true }

[features]
default = ["standalone"]
standalone = ["kapot-executor", "kapot-scheduler"]

object-stores = ["azure", "gcs", "s3", "mgc", "oss"]
azure = ["kapot-executor/azure", "kapot-scheduler/azure"]
s3 = ["kapot-executor/s3", "kapot-scheduler/s3"]
oss = ["kapot-executor/oss", "kapot-scheduler/oss"]
gcs = ["kapot-executor/gcs", "kapot-scheduler/gcs"]
mgc = ["kapot-executor/mgc", "kapot-scheduler/mgc"]
